name: Deploy Chica-admin

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"

      - name: Create .env file for build (multi-line safe)
        run: |
          echo "${{ secrets.PROD_ENV }}" > .env
          echo "====== .env created ======"
          cat .env

      - name: Install dependencies
        run: npm ci

      - name: Run prebuild (with debug logs)
        run: |
          echo "===== START PREBUILD ====="
          npm run prebuild || { echo '❌ prebuild 실패'; exit 1; }
          echo "===== FINISH PREBUILD ====="
          ls -al node_modules/.prisma/client
          ls -al node_modules/@prisma/client

      - name: Build project (standalone)
        run: npm run build

      - name: Copy Prisma Client to standalone
        run: |
          mkdir -p .next/standalone/node_modules/.prisma
          cp -r node_modules/.prisma/client .next/standalone/node_modules/.prisma/client

          mkdir -p .next/standalone/node_modules/@prisma
          cp -r node_modules/@prisma/client .next/standalone/node_modules/@prisma/client

      - name: Compress standalone output (without .env)
        run: |
          tar -czf standalone.tar.gz \
            .next/standalone \
            .next/static \
            public \
            package.json \
            next.config.ts

      - name: Upload build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "standalone.tar.gz"
          target: "~/deploy"

      - name: Deploy on EC2 and restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            source $NVM_DIR/nvm.sh
            export PATH="$NVM_DIR/versions/node/v22.11.0/bin:$PATH"

            mkdir -p ~/chica-admin
            tar -xzf ~/deploy/standalone.tar.gz -C ~/chica-admin --strip-components=0
            cd ~/chica-admin

            echo "${{ secrets.PROD_ENV }}" > .env
            echo "🔍 EC2 .env 내용:"
            cat .env

            echo "🔍 Prisma Client 경로 확인:"
            ls -al .next/standalone/node_modules/.prisma/client
            ls -al .next/standalone/node_modules/@prisma/client

            echo "♻️ PM2 재시작"
            pm2 delete chica-admin || true
            pm2 start .next/standalone/server.js --name chica-admin
            pm2 save

            echo "📋 PM2 상태 확인:"
            pm2 list

            echo "🧾 최근 로그:"
            pm2 logs chica-admin --lines 50
